[package]
name = "libenchcrack"
description = "Code for cracking minecraft's XP seed"
version = "0.2.0"
authors = ["ImUrX <imurx@proton.me>"]
repository = "https://github.com/ImUrX/libenchcrack"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
java-rand = "0.2"
enum-map = "3.1"
strum = "0.28"
strum_macros = "0.28"
rayon = { version = "1.12", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true, features = [
    "no-bundler",
] }
wgpu = { version = "30", optional = true }
indexmap = "2.14"
cfg-if = "1.0"
anyhow = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[build-dependencies]
cfg_aliases = "0.2"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = 3
lto = true

[features]
threads = ["rayon", "wasm-bindgen-rayon"]
compute = ["wgpu"]

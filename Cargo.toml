[package]
name = "libenchcrack"
description = "Code for cracking minecraft's XP seed"
version = "0.2.0"
authors = ["ImUrX <imurx@proton.me>"]
repository = "https://github.com/ImUrX/libenchcrack"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.127"
js-sys = "0.3.104"
java-rand = "0.2.0"
enum-map = "3.1.0"
strum = "0.28.0"
strum_macros = "0.28.0"
rayon = { version = "1.12.0", optional = true }
wasm-bindgen-rayon = { version = "1.3.0", optional = true, features = ["no-bundler"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.77"
web-sys = { version = "0.3.104", features = ["console"] }

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = 3
lto = true

[features]
threads = ["rayon", "wasm-bindgen-rayon"]
